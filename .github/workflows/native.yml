name: Build native effect (libsenzafx)
on:
  workflow_dispatch:
  push:
    paths: ['native/**']
jobs:
  native:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Uji inti DSP (host)
        run: |
          cd native/test
          clang++ -std=c++17 -O2 -Wall -I../src dsp_test.cpp -o dsp_test
          ./dsp_test
      - name: Ambil header AOSP
        id: hdr
        run: |
          INC=$(bash native/scripts/fetch_headers.sh "$RUNNER_TEMP/aosp" | tail -1)
          echo "inc=$INC" >> "$GITHUB_OUTPUT"
          echo "$INC"
      - name: Build arm64 + armv7
        run: |
          NDK="${ANDROID_NDK_LATEST_HOME:-$ANDROID_NDK_HOME}"
          for abi in arm64-v8a armeabi-v7a; do
            cmake -S native -B build/$abi -G Ninja \
              -DCMAKE_TOOLCHAIN_FILE="$NDK/build/cmake/android.toolchain.cmake" \
              -DANDROID_ABI=$abi -DANDROID_PLATFORM=android-28 -DANDROID_STL=c++_static \
              -DCMAKE_BUILD_TYPE=Release -DAOSP_INCLUDES="${{ steps.hdr.outputs.inc }}"
            cmake --build build/$abi
          done
          mkdir -p out/vendor/lib64/soundfx out/vendor/lib/soundfx
          cp build/arm64-v8a/libsenzafx.so out/vendor/lib64/soundfx/
          cp build/armeabi-v7a/libsenzafx.so out/vendor/lib/soundfx/
      - uses: actions/upload-artifact@v4
        with:
          name: libsenzafx-vendor
          path: out/
